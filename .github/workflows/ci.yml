name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lightweight-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Enforce dependency-light package boundary
        run: |
          PYTHONPATH=. python - <<'PY'
          import sys
          import ruthless_pipeline
          from ruthless_pipeline.certification import provenance_graph

          forbidden = {"torch", "torchvision", "numpy", "scipy", "PIL"}
          loaded = sorted(name for name in forbidden if name in sys.modules)
          if loaded:
              raise SystemExit(f"heavy modules imported eagerly: {loaded}")
          assert provenance_graph.GRAPH_SCHEMA_ID == "rac-provenance-graph"
          PY
      - name: Verify committed provenance graph without project install
        run: PYTHONPATH=. python scripts/build_provenance_graph.py --verify

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU ML runtime and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.1" "torchvision>=0.16" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
          python -c "import torch; assert torch.version.cuda is None, torch.version.cuda"
      - name: Lint correctness gate
        run: ruff check .
      - name: Test
        run: pytest
      - name: Smoke test
        run: python -m examples.smoke_test
      - name: Certification contract tests
        run: pytest tests/test_certification.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install audit tooling and CPU ML runtime
        run: |
          python -m pip install --upgrade pip "setuptools>=83" pip-audit
          python -m pip install "torch>=2.1" "torchvision>=0.16" --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; assert torch.version.cuda is None, torch.version.cuda"
      - run: python -m pip install .
      - name: Audit installed dependencies
        run: pip-audit --skip-editable
