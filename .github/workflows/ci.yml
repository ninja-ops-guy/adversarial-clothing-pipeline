name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"
          python -m pip install "numpy>=1.24" "Pillow>=10" "pytest>=8" "ruff>=0.6" "build>=1.2"
          python -m pip install -e . --no-deps
      - name: Critical lint
        run: ruff check . --select F821,F822,F823
      - name: Full lint report
        continue-on-error: true
        run: ruff check . --output-format=github
      - name: Test
        run: pytest
      - name: Smoke test
        run: python -m examples.smoke_test
      - name: Certification contract tests
        run: pytest tests/test_certification.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU runtime and audit tooling
        run: |
          python -m pip install --upgrade pip "setuptools>=83" pip-audit
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"
          python -m pip install "numpy>=1.24" "Pillow>=10"
          python -m pip install . --no-deps
      - run: pip-audit
