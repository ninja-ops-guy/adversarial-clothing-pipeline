name: Provenance Rebuild Candidate

on:
  push:
    branches: [governance-pass4-6-closure]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: governance-pass4-6-closure
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Reconcile current main without force
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Rebuild and verify deterministic provenance graph
        run: |
          PYTHONPATH=. python scripts/build_provenance_graph.py
          PYTHONPATH=. python scripts/build_provenance_graph.py --verify
      - name: Commit reconciliation and rebuilt graph
        run: |
          git add -f artifacts/provenance/graph.json
          if ! git diff --cached --quiet; then
            git commit -m "drift: regenerate provenance graph after governance reconciliation"
          fi
          if git diff --quiet origin/governance-pass4-6-closure..HEAD; then
            echo "No reconciliation push required"
            exit 0
          fi
          git push origin HEAD:governance-pass4-6-closure
