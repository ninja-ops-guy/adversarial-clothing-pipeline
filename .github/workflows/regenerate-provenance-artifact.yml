# Audited regeneration surface: edits to this workflow intentionally trigger a one-shot provenance rebuild.
name: Regenerate provenance artifact

on:
  push:
    paths:
      - .github/workflows/regenerate-provenance-artifact.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install project runtime dependencies
        run: python -m pip install .
      - name: Regenerate deterministic provenance graph
        run: PYTHONPATH=. python scripts/build_provenance_graph.py
      - name: Verify regenerated graph
        run: PYTHONPATH=. python scripts/build_provenance_graph.py --verify
      - name: Commit verified graph when changed
        run: |
          git add -f artifacts/provenance/graph.json
          if git diff --cached --quiet; then
            echo "Provenance graph is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh deterministic provenance graph"
          git push
      - name: Upload regenerated graph
        uses: actions/upload-artifact@v6
        with:
          name: regenerated-provenance-graph
          path: artifacts/provenance/graph.json
          if-no-files-found: error
          retention-days: 1
