name: PR Regenerate Program State

on:
  push:
    branches: [chatgpt/product-studio-pattern-catalog]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Regenerate program state
        run: python -m ruthless_pipeline.program_state.compile
      - name: Upload regenerated state
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-program-state-${{ github.sha }}
          path: |
            program_state/program_state.json
            program_state/SUMMARY.md
          if-no-files-found: error
