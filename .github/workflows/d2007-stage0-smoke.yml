name: D2-0007 Stage-0 Landmark-Free Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/d2007-stage0-smoke.yml'
      - 'scripts/d2007_landmark_free_smoke.py'
      - 'ruthless_pipeline/patterns/d2007_smoke.py'
      - 'tests/patterns/test_d2007_smoke.py'

permissions:
  contents: read

concurrency:
  group: d2-0007-stage0-landmark-free-smoke
  cancel-in-progress: false

jobs:
  stage0-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HOME: ${{ github.workspace }}/.model-cache/huggingface
      TORCH_HOME: ${{ github.workspace }}/.model-cache/torch
      ULTRALYTICS_SETTINGS_DIR: ${{ github.workspace }}/.model-cache/ultralytics
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assert D2-0007 remains preregistered and unarmed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          g = json.loads(Path('generations/RAC-PER-D2-0007.json').read_text())
          assert g['generation_id'] == 'RAC-PER-D2-0007'
          assert g['lock_status'] == 'PREREGISTERED'
          assert g['armed'] is False
          assert g['lock_inference_performed'] is False
          assert g['heldout_feedback_allowed'] is False
          print('D2-0007 preregistration boundary intact')
          PY

      - name: Assert Stage-0 model boundary is PERSON-SUR-v3 only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('model_sets/PERSON-SUR-v3.json').read_text())
          expected = [
              'yolov8n',
              'fasterrcnn_mobilenet_v3_320',
              'detr_resnet50',
              'ssdlite320_mobilenet_v3',
              'retinanet_resnet50_fpn_v2',
              'fcos_resnet50_fpn',
          ]
          assert s['model_set_id'] == 'PERSON-SUR-v3'
          assert s['role'] == 'surrogate'
          assert s['models'] == expected
          assert all('heldout' not in model.lower() for model in s['models'])
          print('surrogate-only model boundary intact')
          PY

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache surrogate detector weights
        uses: actions/cache@v4
        with:
          path: |
            .model-cache
            yolov8n.pt
          key: d2007-stage0-surrogates-v1-${{ runner.os }}

      - name: Install pinned CPU PyTorch from runtime lock
        run: |
          python -m pip install --upgrade pip
          TORCH=$(python -c "import json;print(json.load(open('benchmarks/runtime_lock.json'))['torch'])")
          TORCHVISION=$(python -c "import json;print(json.load(open('benchmarks/runtime_lock.json'))['torchvision'])")
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==${TORCH}" "torchvision==${TORCHVISION}"

      - name: Install pipeline and pinned surrogate adapters
        run: |
          python -m pip install -e . --no-deps
          python -m pip install -r benchmarks/requirements.txt
          ULTRALYTICS=$(python -c "import json;print(json.load(open('benchmarks/runtime_lock.json'))['ultralytics'])")
          TRANSFORMERS=$(python -c "import json;print(json.load(open('benchmarks/runtime_lock.json'))['transformers'])")
          python -m pip install "ultralytics==${ULTRALYTICS}" "transformers==${TRANSFORMERS}"

      - name: Verify runtime lock before model download or inference
        run: python scripts/verify_runtime_lock.py

      - name: Run Stage-0 landmark-free PATTERNS smoke
        run: |
          python scripts/d2007_landmark_free_smoke.py \
            --manifest benchmarks/model_manifest.json \
            --model-set model_sets/PERSON-SUR-v3.json \
            --output benchmarks/runtime/d2-0007/stage0-landmark-free-smoke.json

      - name: Validate Stage-0 receipt and scientific boundary
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('benchmarks/runtime/d2-0007/stage0-landmark-free-smoke.json')
          r = json.loads(p.read_text())
          assert r['generation_id'] == 'RAC-PER-D2-0007'
          assert r['status'] == 'PASS'
          assert r['landmark_free'] is True
          assert r['surrogate_only'] is True
          assert r['heldout_access'] is False
          assert r['model_set_id'] == 'PERSON-SUR-v3'
          assert r['invalid_condition_fraction'] <= 0.10
          assert r['screening_opened'] is False
          assert r['optimization_opened'] is False
          assert r['candidate_freeze_created'] is False
          assert r['alpha_002_promoted'] is False
          expected = {
              'yolov8n',
              'fasterrcnn_mobilenet_v3_320',
              'detr_resnet50',
              'ssdlite320_mobilenet_v3',
              'retinanet_resnet50_fpn_v2',
              'fcos_resnet50_fpn',
          }
          assert set(r['per_surrogate_detection_rates']) == expected
          body = dict(r)
          digest = body.pop('telemetry_sha256')
          encoded = json.dumps(body, sort_keys=True, separators=(',', ':')).encode()
          assert hashlib.sha256(encoded).hexdigest() == digest
          print(json.dumps({
              'status': r['status'],
              'candidate_id': r['candidate_id'],
              'telemetry_sha256': digest,
              'invalid_condition_fraction': r['invalid_condition_fraction'],
          }, indent=2, sort_keys=True))
          PY

      - name: Assert execution did not mutate tracked scientific surfaces
        run: git diff --exit-code

      - name: Upload Stage-0 receipt
        uses: actions/upload-artifact@v4
        with:
          name: d2-0007-stage0-landmark-free-${{ github.run_id }}
          path: |
            benchmarks/runtime/d2-0007/stage0-landmark-free-smoke.json
            benchmarks/runtime/d2-0007/benchmark/fixture/*.png
          retention-days: 90
