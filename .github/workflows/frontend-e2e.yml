name: Frontend E2E

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'core.js'
      - 'ui.js'
      - 'analysis.js'
      - 'package.json'
      - 'playwright.config.js'
      - 'tests/e2e/**'
      - '.github/workflows/frontend-e2e.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  deployed-pages-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: local-browser-matrix
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify deployed site
        env:
          BASE_URL: https://ninja-ops-guy.github.io/adversarial-clothing-pipeline/
        run: |
          for attempt in {1..12}; do
            if npx playwright test --project=chromium-desktop --grep "all pattern generators|analysis produces|PNG, JSON, SVG"; then
              exit 0
            fi
            echo "Pages smoke attempt $attempt failed; waiting for deployment propagation..."
            sleep 10
          done
          exit 1
