<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="t"><title id="t">RAC Pattern Lab vs measured evidence</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#999"/></marker><style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:24px;font-weight:700}.n{font-size:13px;font-weight:600}.s{font-size:11px;fill:#777}.b{fill:#f7f7f7;stroke:#c8c8c8;stroke-width:1.5}.y{fill:#fff8d8;stroke:#d1ad22;stroke-width:1.5}.g{fill:#eaf8ef;stroke:#57a66e;stroke-width:1.5}.e{stroke:#999;stroke-width:2;marker-end:url(#a);fill:none}</style></defs><rect width="1200" height="450" fill="white"/><text x="600" y="38" text-anchor="middle" class="h">RAC Pattern Lab vs measured evidence</text><rect class="b" x="50" y="180" rx="8" width="150" height="70"/><text x="125" y="210" text-anchor="middle" class="n">Pattern Lab</text><text x="125" y="230" text-anchor="middle" class="s">browser UI</text><rect class="b" x="285" y="90" rx="8" width="175" height="70"/><text x="372" y="120" text-anchor="middle" class="n">Heuristic exploration</text><text x="372" y="140" text-anchor="middle" class="s">visual / subjective</text><rect class="b" x="285" y="270" rx="8" width="175" height="70"/><text x="372" y="300" text-anchor="middle" class="n">Config export</text><text x="372" y="320" text-anchor="middle" class="s">PNG / JSON</text><rect class="b" x="545" y="90" rx="8" width="185" height="70"/><text x="637" y="120" text-anchor="middle" class="n">UI display — heuristic</text><text x="637" y="140" text-anchor="middle" class="s">labeled exploratory</text><rect class="b" x="545" y="270" rx="8" width="185" height="70"/><text x="637" y="300" text-anchor="middle" class="n">Python research stack</text><text x="637" y="320" text-anchor="middle" class="s">research + eval</text><rect class="g" x="805" y="270" rx="8" width="175" height="70"/><text x="892" y="300" text-anchor="middle" class="n">Measured benchmark</text><text x="892" y="320" text-anchor="middle" class="s">frozen manifests</text><rect class="y" x="805" y="90" rx="8" width="175" height="70"/><text x="892" y="120" text-anchor="middle" class="n">Certified evidence import</text><text x="892" y="140" text-anchor="middle" class="s">provenance-linked</text><rect class="g" x="1025" y="180" rx="8" width="145" height="70"/><text x="1097" y="210" text-anchor="middle" class="n">UI display</text><text x="1097" y="230" text-anchor="middle" class="s">labeled measured</text><path class="e" d="M200 198 L283 140"/><path class="e" d="M200 232 L283 290"/><line class="e" x1="460" y1="125" x2="543" y2="125"/><line class="e" x1="460" y1="305" x2="543" y2="305"/><line class="e" x1="730" y1="305" x2="803" y2="305"/><path class="e" d="M892 270 L892 162"/><path class="e" d="M980 125 L1023 198"/><text x="600" y="405" text-anchor="middle" class="s">The UI shows both, but provenance and evidence labels keep heuristic and measured information visibly distinct.</text></svg>