<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t"><title id="t">RAC four-plane architecture</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#999"/></marker><style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:24px;font-weight:700}.sh{font-size:14px;font-weight:700}.n{font-size:13px;font-weight:600}.s{font-size:11px;fill:#777}.box{fill:#f7f7f7;stroke:#c8c8c8;stroke-width:1.4}.plane{fill:#fff;stroke:#d5d5d5;stroke-width:2}.y{fill:#fff8d8;stroke:#d1ad22;stroke-width:1.5}.r{fill:#fdeeee;stroke:#c96b6b;stroke-width:1.5}.e{stroke:#999;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1200" height="700" fill="white"/><text x="600" y="38" text-anchor="middle" class="h">RAC four-plane architecture</text><g><rect class="plane" x="35" y="70" rx="12" width="545" height="245"/><text x="55" y="98" class="sh">EXPLORATION PLANE</text><rect class="box" x="75" y="125" rx="7" width="135" height="58"/><text x="142" y="150" text-anchor="middle" class="n">Pattern Lab</text><text x="142" y="168" text-anchor="middle" class="s">browser UI</text><rect class="box" x="240" y="125" rx="7" width="135" height="58"/><text x="307" y="150" text-anchor="middle" class="n">Procedural</text><text x="307" y="168" text-anchor="middle" class="s">generators</text><rect class="box" x="405" y="125" rx="7" width="135" height="58"/><text x="472" y="150" text-anchor="middle" class="n">Heuristic</text><text x="472" y="168" text-anchor="middle" class="s">analysis</text><rect class="box" x="105" y="220" rx="7" width="400" height="55"/><text x="305" y="253" text-anchor="middle" class="n">PNG / JSON / config export</text><line class="e" x1="142" y1="183" x2="142" y2="218"/><line class="e" x1="307" y1="183" x2="307" y2="218"/><line class="e" x1="472" y1="183" x2="472" y2="218"/><text x="305" y="296" text-anchor="middle" class="s">output is exploratory — not measured evidence</text></g><g><rect class="plane" x="620" y="70" rx="12" width="545" height="245"/><text x="640" y="98" class="sh">RESEARCH PLANE</text><rect class="box" x="660" y="125" rx="7" width="135" height="58"/><text x="727" y="150" text-anchor="middle" class="n">Texture prior</text><text x="727" y="168" text-anchor="middle" class="s">/ NAP</text><rect class="box" x="825" y="125" rx="7" width="135" height="58"/><text x="892" y="150" text-anchor="middle" class="n">Env-adaptive</text><text x="892" y="168" text-anchor="middle" class="s">optimizer</text><rect class="box" x="990" y="125" rx="7" width="135" height="58"/><text x="1057" y="150" text-anchor="middle" class="n">Neural</text><text x="1057" y="168" text-anchor="middle" class="s">deformation</text><rect class="box" x="660" y="220" rx="7" width="135" height="58"/><text x="727" y="245" text-anchor="middle" class="n">Diff. cloth</text><text x="727" y="263" text-anchor="middle" class="s">physics</text><rect class="box" x="825" y="220" rx="7" width="135" height="58"/><text x="892" y="245" text-anchor="middle" class="n">Scene</text><text x="892" y="263" text-anchor="middle" class="s">composition</text><rect class="box" x="990" y="220" rx="7" width="135" height="58"/><text x="1057" y="245" text-anchor="middle" class="n">Evaluator</text><text x="1057" y="263" text-anchor="middle" class="s">adapters</text><text x="892" y="296" text-anchor="middle" class="s">surrogate-only scoring — held-out models stay outside this loop</text></g><g><rect class="plane" x="35" y="365" rx="12" width="545" height="245"/><text x="55" y="393" class="sh">CERTIFICATION &amp; EVIDENCE PLANE</text><rect class="y" x="75" y="425" rx="7" width="135" height="58"/><text x="142" y="450" text-anchor="middle" class="n">Frozen</text><text x="142" y="468" text-anchor="middle" class="s">manifests</text><rect class="y" x="240" y="425" rx="7" width="135" height="58"/><text x="307" y="450" text-anchor="middle" class="n">Surrogate /</text><text x="307" y="468" text-anchor="middle" class="s">held-out</text><rect class="y" x="405" y="425" rx="7" width="135" height="58"/><text x="472" y="450" text-anchor="middle" class="n">Numerical</text><text x="472" y="468" text-anchor="middle" class="s">verification</text><rect class="y" x="75" y="520" rx="7" width="135" height="58"/><text x="142" y="545" text-anchor="middle" class="n">Provenance</text><text x="142" y="563" text-anchor="middle" class="s">integrity checks</text><rect class="y" x="240" y="520" rx="7" width="135" height="58"/><text x="307" y="545" text-anchor="middle" class="n">Sealed</text><text x="307" y="563" text-anchor="middle" class="s">artifacts</text><rect class="r" x="405" y="520" rx="7" width="135" height="58"/><text x="472" y="545" text-anchor="middle" class="n">Promotion /</text><text x="472" y="563" text-anchor="middle" class="s">refusal gates</text><line class="e" x1="142" y1="483" x2="142" y2="518"/><line class="e" x1="307" y1="483" x2="307" y2="518"/><line class="e" x1="472" y1="483" x2="472" y2="518"/></g><g><rect class="plane" x="620" y="365" rx="12" width="545" height="245"/><text x="640" y="393" class="sh">PHYSICAL VALIDATION PLANE</text><rect class="box" x="660" y="425" rx="7" width="135" height="58"/><text x="727" y="450" text-anchor="middle" class="n">Matched</text><text x="727" y="468" text-anchor="middle" class="s">candidate/control</text><rect class="box" x="825" y="425" rx="7" width="135" height="58"/><text x="892" y="450" text-anchor="middle" class="n">Calibration</text><text x="892" y="468" text-anchor="middle" class="s">print + color</text><rect class="box" x="990" y="425" rx="7" width="135" height="58"/><text x="1057" y="450" text-anchor="middle" class="n">Capture</text><text x="1057" y="468" text-anchor="middle" class="s">preregistered</text><rect class="box" x="660" y="520" rx="7" width="135" height="58"/><text x="727" y="545" text-anchor="middle" class="n">Measured</text><text x="727" y="563" text-anchor="middle" class="s">outputs</text><rect class="box" x="825" y="520" rx="7" width="135" height="58"/><text x="892" y="545" text-anchor="middle" class="n">Statistics</text><text x="892" y="563" text-anchor="middle" class="s">+ uncertainty</text><rect class="box" x="990" y="520" rx="7" width="135" height="58"/><text x="1057" y="545" text-anchor="middle" class="n">Replication</text><text x="1057" y="563" text-anchor="middle" class="s">+ durability</text><line class="e" x1="795" y1="454" x2="823" y2="454"/><line class="e" x1="960" y1="454" x2="988" y2="454"/><line class="e" x1="1057" y1="483" x2="1057" y2="518"/><line class="e" x1="990" y1="549" x2="962" y2="549"/><line class="e" x1="825" y1="549" x2="797" y2="549"/></g><line class="e" x1="580" y1="192" x2="618" y2="192"/><line class="e" x1="892" y1="315" x2="892" y2="363"/><line class="e" x1="580" y1="487" x2="618" y2="487"/><path d="M1057 610 C1057 660 300 660 300 610" fill="none" stroke="#d1ad22" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a)"/><text x="680" y="680" text-anchor="middle" class="s">measured evidence returns to the evidence plane</text></svg>