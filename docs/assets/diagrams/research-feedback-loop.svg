<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t"><title id="t">RAC research feedback loop</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#999"/></marker><style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:24px;font-weight:700}.n{font-size:13px;font-weight:600}.s{font-size:11px;fill:#777}.b{fill:#f7f7f7;stroke:#c8c8c8;stroke-width:1.5}.y{fill:#fff8d8;stroke:#d1ad22;stroke-width:1.5}.e{stroke:#999;stroke-width:2;marker-end:url(#a);fill:none}.loop{stroke:#d1ad22;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#a);fill:none}</style></defs><rect width="1200" height="360" fill="white"/><text x="600" y="38" text-anchor="middle" class="h">RAC research feedback loop</text><g transform="translate(40,120)"><rect class="b" x="0" y="0" rx="8" width="115" height="62"/><text x="57" y="27" text-anchor="middle" class="n">Research</text><text x="57" y="46" text-anchor="middle" class="s">question</text><line class="e" x1="115" y1="31" x2="140" y2="31"/><rect class="y" x="140" y="0" rx="8" width="115" height="62"/><text x="197" y="27" text-anchor="middle" class="n">Preregister</text><text x="197" y="46" text-anchor="middle" class="s">protocol</text><line class="e" x1="255" y1="31" x2="280" y2="31"/><rect class="b" x="280" y="0" rx="8" width="115" height="62"/><text x="337" y="27" text-anchor="middle" class="n">Generate</text><text x="337" y="46" text-anchor="middle" class="s">candidate</text><line class="e" x1="395" y1="31" x2="420" y2="31"/><rect class="b" x="420" y="0" rx="8" width="115" height="62"/><text x="477" y="37" text-anchor="middle" class="n">Evaluate</text><line class="e" x1="535" y1="31" x2="560" y2="31"/><rect class="y" x="560" y="0" rx="8" width="115" height="62"/><text x="617" y="27" text-anchor="middle" class="n">Certify /</text><text x="617" y="46" text-anchor="middle" class="s">retain</text><line class="e" x1="675" y1="31" x2="700" y2="31"/><rect class="b" x="700" y="0" rx="8" width="115" height="62"/><text x="757" y="37" text-anchor="middle" class="n">Analyze</text><line class="e" x1="815" y1="31" x2="840" y2="31"/><rect class="b" x="840" y="0" rx="8" width="115" height="62"/><text x="897" y="27" text-anchor="middle" class="n">Release /</text><text x="897" y="46" text-anchor="middle" class="s">manuscript</text><line class="e" x1="955" y1="31" x2="980" y2="31"/><rect class="b" x="980" y="0" rx="8" width="115" height="62"/><text x="1037" y="27" text-anchor="middle" class="n">Next</text><text x="1037" y="46" text-anchor="middle" class="s">hypothesis</text><path class="loop" d="M1037 62 L1037 145 L57 145 L57 64"/></g><text x="600" y="315" text-anchor="middle" class="s">The loop is experimental, not self-validating: a next hypothesis begins a new frozen generation rather than changing old evidence.</text></svg>