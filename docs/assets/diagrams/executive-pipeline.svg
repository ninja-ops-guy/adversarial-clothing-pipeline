<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d"><title id="t">RAC executive pipeline — design to manufacturing conformity</title><desc id="d">Design flows through optimization, simulation, benchmark, certification, print, physical trial, and manufacturing conformity.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/></marker><style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:22px;font-weight:700}.n{font-size:14px;font-weight:600}.s{font-size:11px;fill:#777}.b{fill:#f7f7f7;stroke:#c8c8c8;stroke-width:1.5}.y{fill:#fff8d8;stroke:#d1ad22;stroke-width:1.5}.g{fill:#eaf8ef;stroke:#57a66e;stroke-width:1.5}.e{stroke:#9a9a9a;stroke-width:2;marker-end:url(#a)}</style></defs><rect width="1200" height="260" fill="white"/><text x="600" y="34" text-anchor="middle" class="h">RAC executive pipeline — design to manufacturing conformity</text><g transform="translate(35,85)"><rect class="b" x="0" y="0" rx="8" width="120" height="65"/><text class="n" x="60" y="28" text-anchor="middle">Design</text><text class="s" x="60" y="47" text-anchor="middle">Pattern Lab</text><line class="e" x1="120" y1="32" x2="145" y2="32"/><rect class="b" x="145" y="0" rx="8" width="120" height="65"/><text class="n" x="205" y="28" text-anchor="middle">Optimize</text><text class="s" x="205" y="47" text-anchor="middle">Optimization V3</text><line class="e" x1="265" y1="32" x2="290" y2="32"/><rect class="b" x="290" y="0" rx="8" width="120" height="65"/><text class="n" x="350" y="28" text-anchor="middle">Simulate</text><text class="s" x="350" y="47" text-anchor="middle">deformation + cloth</text><line class="e" x1="410" y1="32" x2="435" y2="32"/><rect class="b" x="435" y="0" rx="8" width="120" height="65"/><text class="n" x="495" y="28" text-anchor="middle">Benchmark</text><text class="s" x="495" y="47" text-anchor="middle">frozen eval</text><line class="e" x1="555" y1="32" x2="580" y2="32"/><rect class="y" x="580" y="0" rx="8" width="120" height="65"/><text class="n" x="640" y="28" text-anchor="middle">Certify</text><text class="s" x="640" y="47" text-anchor="middle">fail-closed gate</text><line class="e" x1="700" y1="32" x2="725" y2="32"/><rect class="b" x="725" y="0" rx="8" width="120" height="65"/><text class="n" x="785" y="28" text-anchor="middle">Print</text><text class="s" x="785" y="47" text-anchor="middle">matched pair</text><line class="e" x1="845" y1="32" x2="870" y2="32"/><rect class="b" x="870" y="0" rx="8" width="120" height="65"/><text class="n" x="930" y="28" text-anchor="middle">Physical trial</text><text class="s" x="930" y="47" text-anchor="middle">preregistered P1</text><line class="e" x1="990" y1="32" x2="1015" y2="32"/><rect class="g" x="1015" y="0" rx="8" width="120" height="65"/><text class="n" x="1075" y="28" text-anchor="middle">Mfg. conformity</text><text class="s" x="1075" y="47" text-anchor="middle">M1 / M2</text></g><text x="600" y="205" text-anchor="middle" class="s">A failure at any stage is retained as a negative result — never rewritten as success.</text></svg>