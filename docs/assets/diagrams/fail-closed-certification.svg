<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t"><title id="t">RAC fail-closed certification flow</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#999"/></marker><style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:24px;font-weight:700}.n{font-size:13px;font-weight:600}.s{font-size:11px;fill:#777}.b{fill:#f7f7f7;stroke:#c8c8c8;stroke-width:1.5}.y{fill:#fff8d8;stroke:#d1ad22;stroke-width:1.5}.g{fill:#eaf8ef;stroke:#57a66e;stroke-width:1.5}.r{fill:#fdeeee;stroke:#c96b6b;stroke-width:1.5}.e{stroke:#999;stroke-width:2;marker-end:url(#a);fill:none}.bad{stroke:#c96b6b;stroke-width:2;marker-end:url(#a);fill:none}</style></defs><rect width="1200" height="720" fill="white"/><text x="600" y="38" text-anchor="middle" class="h">RAC fail-closed certification flow</text><g transform="translate(80,85)"><rect class="b" x="0" y="0" rx="8" width="150" height="62"/><text x="75" y="26" text-anchor="middle" class="n">Incoming</text><text x="75" y="45" text-anchor="middle" class="s">experiment artifact</text><line class="e" x1="150" y1="31" x2="190" y2="31"/><rect class="y" x="190" y="0" rx="8" width="150" height="62"/><text x="265" y="36" text-anchor="middle" class="n">Schema valid?</text><line class="e" x1="340" y1="31" x2="380" y2="31"/><rect class="y" x="380" y="0" rx="8" width="150" height="62"/><text x="455" y="27" text-anchor="middle" class="n">Hashes / pins</text><text x="455" y="46" text-anchor="middle" class="n">valid?</text><line class="e" x1="530" y1="31" x2="570" y2="31"/><rect class="y" x="570" y="0" rx="8" width="150" height="62"/><text x="645" y="36" text-anchor="middle" class="n">Finite outputs?</text><line class="e" x1="720" y1="31" x2="760" y2="31"/><rect class="y" x="760" y="0" rx="8" width="150" height="62"/><text x="835" y="27" text-anchor="middle" class="n">Candidate-control</text><text x="835" y="46" text-anchor="middle" class="n">pair valid?</text><line class="e" x1="910" y1="31" x2="950" y2="31"/><rect class="r" x="950" y="0" rx="8" width="150" height="62"/><text x="1025" y="27" text-anchor="middle" class="n">REFUSE</text><text x="1025" y="46" text-anchor="middle" class="s">explicit failure</text><rect class="y" x="190" y="135" rx="8" width="150" height="62"/><text x="265" y="162" text-anchor="middle" class="n">Replay / integrity</text><text x="265" y="181" text-anchor="middle" class="n">checks pass?</text><rect class="y" x="380" y="135" rx="8" width="150" height="62"/><text x="455" y="162" text-anchor="middle" class="n">Model split</text><text x="455" y="181" text-anchor="middle" class="n">valid?</text><path class="e" d="M835 62 L835 100 L455 100 L455 133"/><line class="e" x1="380" y1="166" x2="342" y2="166"/><rect class="g" x="190" y="270" rx="8" width="150" height="62"/><text x="265" y="297" text-anchor="middle" class="n">Seal evidence</text><text x="265" y="316" text-anchor="middle" class="n">bundle</text><line class="e" x1="265" y1="197" x2="265" y2="268"/><rect class="y" x="380" y="270" rx="8" width="175" height="62"/><text x="467" y="297" text-anchor="middle" class="n">Promotion criteria</text><text x="467" y="316" text-anchor="middle" class="n">met?</text><line class="e" x1="340" y1="301" x2="378" y2="301"/><rect class="g" x="660" y="235" rx="8" width="190" height="70"/><text x="755" y="265" text-anchor="middle" class="n">Promote</text><text x="755" y="285" text-anchor="middle" class="s">next evidence stage</text><rect class="r" x="660" y="340" rx="8" width="190" height="70"/><text x="755" y="370" text-anchor="middle" class="n">Retain failure</text><text x="755" y="390" text-anchor="middle" class="s">measured negative result</text><line class="e" x1="555" y1="291" x2="658" y2="270"/><line class="e" x1="555" y1="311" x2="658" y2="375"/><text x="595" y="267" class="s">yes</text><text x="595" y="355" class="s">no</text><path class="bad" d="M265 62 L265 90 L1025 90 L1025 64"/><path class="bad" d="M455 62 L455 108 L1025 108 L1025 64"/><path class="bad" d="M645 62 L645 126 L1025 126 L1025 64"/><path class="bad" d="M455 197 L455 215 L1025 215 L1025 64"/><path class="bad" d="M265 197 L265 225 L1025 225 L1025 64"/></g><text x="600" y="660" text-anchor="middle" class="s">Every required check must pass. Any failure produces an explicit refusal, not a silent fix.</text></svg>