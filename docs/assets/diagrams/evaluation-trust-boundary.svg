<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t"><title id="t">RAC evaluation trust boundary</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#999"/></marker><style>text{font-family:Arial,sans-serif;fill:#222}.h{font-size:24px;font-weight:700}.sh{font-size:14px;font-weight:700}.n{font-size:13px;font-weight:600}.s{font-size:11px;fill:#777}.b{fill:#f7f7f7;stroke:#c8c8c8;stroke-width:1.5}.y{fill:#fff8d8;stroke:#d1ad22;stroke-width:1.5}.g{fill:#eaf8ef;stroke:#57a66e;stroke-width:1.5}.r{fill:#fdeeee;stroke:#c96b6b;stroke-width:1.5}.plane{fill:#fff;stroke:#d5d5d5;stroke-width:2}.e{stroke:#999;stroke-width:2;marker-end:url(#a);fill:none}</style></defs><rect width="1200" height="500" fill="white"/><text x="600" y="38" text-anchor="middle" class="h">RAC evaluation trust boundary</text><rect class="plane" x="35" y="80" rx="12" width="440" height="270"/><text x="55" y="108" class="sh">OPTIMIZATION BOUNDARY</text><rect class="b" x="80" y="145" rx="8" width="145" height="70"/><text x="152" y="175" text-anchor="middle" class="n">Surrogate</text><text x="152" y="195" text-anchor="middle" class="s">model set</text><rect class="b" x="285" y="145" rx="8" width="145" height="70"/><text x="357" y="175" text-anchor="middle" class="n">Optimizer</text><text x="357" y="195" text-anchor="middle" class="s">surrogate-only</text><rect class="y" x="182" y="260" rx="8" width="145" height="70"/><text x="254" y="290" text-anchor="middle" class="n">Candidate artifact</text><text x="254" y="310" text-anchor="middle" class="s">unfrozen</text><line class="e" x1="225" y1="180" x2="283" y2="180"/><path class="e" d="M357 215 L357 235 L254 235 L254 258"/><rect class="y" x="510" y="180" rx="8" width="165" height="82"/><text x="592" y="213" text-anchor="middle" class="n">Freeze candidate</text><text x="592" y="234" text-anchor="middle" class="s">hash + provenance</text><line class="e" x1="327" y1="295" x2="508" y2="221"/><rect class="plane" x="720" y="80" rx="12" width="445" height="320"/><text x="740" y="108" class="sh">CERTIFICATION BOUNDARY</text><rect class="b" x="760" y="145" rx="8" width="130" height="70"/><text x="825" y="175" text-anchor="middle" class="n">Held-out</text><text x="825" y="195" text-anchor="middle" class="s">model set</text><rect class="b" x="925" y="145" rx="8" width="130" height="70"/><text x="990" y="175" text-anchor="middle" class="n">Frozen</text><text x="990" y="195" text-anchor="middle" class="s">transforms</text><rect class="b" x="842" y="245" rx="8" width="130" height="70"/><text x="907" y="275" text-anchor="middle" class="n">Benchmark</text><text x="907" y="295" text-anchor="middle" class="s">+ verify</text><rect class="r" x="1010" y="245" rx="8" width="115" height="70"/><text x="1067" y="285" text-anchor="middle" class="n">Gate</text><rect class="g" x="775" y="335" rx="8" width="150" height="50"/><text x="850" y="365" text-anchor="middle" class="n">Promotable evidence</text><rect class="r" x="965" y="335" rx="8" width="150" height="50"/><text x="1040" y="365" text-anchor="middle" class="n">Retained negative</text><path class="e" d="M675 221 L840 280"/><line class="e" x1="825" y1="215" x2="880" y2="243"/><line class="e" x1="990" y1="215" x2="935" y2="243"/><line class="e" x1="972" y1="280" x2="1008" y2="280"/><path class="e" d="M1067 315 L1067 326 L850 326 L850 333"/><line class="e" x1="1067" y1="315" x2="1040" y2="333"/><text x="600" y="455" text-anchor="middle" class="s">Candidate freezes before held-out evaluation; held-out results may not retroactively alter the measured generation.</text></svg>