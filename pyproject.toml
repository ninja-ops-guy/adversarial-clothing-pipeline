[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ruthless-adversarial-pipeline"
version = "3.1.0"
description = "Research pipeline for machine-optimized apparel evaluation in owned/authorized computer-vision labs"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "scipy>=1.11",
  "Pillow>=10",
  "jsonschema>=4.20",
]

[project.scripts]
rac-platform = "ruthless_pipeline.platform_runtime:main"

[project.optional-dependencies]
generative = ["diffusers>=0.30", "transformers>=4.40", "accelerate>=0.30", "safetensors>=0.4"]
aesthetic = ["open_clip_torch>=2.24"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.setuptools.packages.find]
include = ["ruthless_pipeline*"]

[tool.ruff.lint]
# Keep CI blocking on correctness while the legacy style/modernization backlog is
# cleaned incrementally. These rules catch syntax/parse errors and invalid or
# undefined names without turning formatting debt into a release blocker.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# Barrier 3 deliberately re-exports the preserved coordinator core dynamically
# so stage hooks remain monkeypatchable at the historical public module path.
# Runtime tests exercise those bindings; F821 cannot infer globals() injection.
"ruthless_pipeline/certification/rehearsal_barrier3.py" = ["F821"]
